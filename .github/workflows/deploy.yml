name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
            
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-
            
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-
            
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          
      - name: Setup wasm-bindgen
        uses: baptiste0928/cargo-install@v3
        with:
          crate: wasm-bindgen-cli
          
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown
        
      - name: Generate JS bindings
        run: wasm-bindgen --target web --out-dir www/pkg target/wasm32-unknown-unknown/release/xg-editor.wasm

      # 注入 commit hash 到 APP_VERSION (仅 www/index.html 的 APP_VERSION 行), 用于 Pages 追溯。
      # 例: "0.1.1" → "0.1.1-abc1234"。仅替换 APP_VERSION = "..." 行, 不影响 ?v= 参数。
      - name: Stamp commit hash into APP_VERSION
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "Stamping version with commit ${SHA}"
          sed -i -E 's/(const APP_VERSION = ")([^"]*)(";)/\1\2-'"${SHA}"'\3/' www/index.html
          grep -n 'APP_VERSION' www/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          force_orphan: true
